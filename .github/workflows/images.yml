name: container image
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['app/**', 'scripts/**', 'config/knowledge-base.env.example', 'deployment/compose/**', '.dockerignore', '.github/workflows/images.yml']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/compose/app/Dockerfile
          load: true
          tags: carrel-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Light runtime and persistence
        run: |
          docker run -d --name carrel-image-check --init -e KB_STORAGE_BACKEND=light -v carrel-image-check:/data carrel-app:test
          trap 'docker logs carrel-image-check; docker rm -f carrel-image-check; docker volume rm carrel-image-check' EXIT
          for attempt in $(seq 1 30); do
            if docker exec carrel-image-check python -m kb_runtime health; then break; fi
            sleep 2
          done
          docker exec carrel-image-check python -m kb_runtime health
          docker exec carrel-image-check sh -c 'test "$(cat /data/runtime/deployment-mode)" = light'
          docker restart -t 60 carrel-image-check
          for attempt in $(seq 1 30); do
            if docker exec carrel-image-check python -m kb_runtime health; then break; fi
            sleep 2
          done
          docker exec carrel-image-check python -m kb_runtime health
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Publish amd64 and arm64
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/compose/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
