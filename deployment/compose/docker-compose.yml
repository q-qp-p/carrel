# Carrel application + MinerU; enable the standard profile for database services.
name: carrel

# json-file has no size limit by default and a log is only cleared when its
# container is recreated; keep at most 3 x 50 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  app:
    image: ${CARREL_IMAGE:-carrel-app:local}
    build:
      context: ../..
      dockerfile: deployment/compose/app/Dockerfile
      args:
        PYTHON_IMAGE: ${CARREL_PYTHON_IMAGE:-python:3.12-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org}
        WITH_PDF_IMAGES: ${WITH_PDF_IMAGES:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    hostname: ${COMPOSE_PROJECT_NAME:-carrel}-app
    init: true
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 60s
    environment:
      KB_STORAGE_BACKEND: ${CARREL_EDITION:-standard}
      KB_WEB_HOST: 0.0.0.0
      KB_SEARCH_HOST: 0.0.0.0
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-CHANGE_ME}
      TZ: ${TZ:-UTC}
    volumes:
      - "${CARREL_DATA_PATH:-../../data}:/data:rw"
      - "${MINERU_OUTPUT_PATH:-../../runtime/mineru-output}:/data/runtime/mineru-output:rw"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-9800}:9800"
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${SEARCH_PORT:-9810}:9810"
    healthcheck:
      test: ["CMD", "python", "-m", "kb_runtime", "health"]
      interval: 15s
      timeout: 12s
      retries: 4
      start_period: 30s
    networks: [carrel]

  mineru:
    image: carrel-mineru:${MINERU_VERSION:-3.4.4}-${MINERU_FLAVOR:-cpu}
    build:
      context: ./mineru
      args:
        FLAVOR: ${MINERU_FLAVOR:-cpu}
        BASE_IMAGE: ${MINERU_BASE_IMAGE:-python:3.12-slim}
        MINERU_VERSION: ${MINERU_VERSION:-3.4.4}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ${COMPOSE_PROJECT_NAME:-carrel}-mineru
    restart: unless-stopped
    ipc: host
    logging: *default-logging
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${MINERU_PORT:-8765}:8000"
    volumes:
      - "${MINERU_MODELS_PATH:-../../models/mineru}:/models:rw"
      - "${MINERU_OUTPUT_PATH:-../../runtime/mineru-output}:/data/output:rw"
    environment:
      CUDA_VISIBLE_DEVICES: "${MINERU_CUDA_VISIBLE_DEVICES:-0}"
      MINERU_BACKEND_POLICY: "${MINERU_BACKEND_POLICY:-auto}"
      MINERU_MODEL_SOURCE: "${MINERU_MODEL_SOURCE:-auto}"
      MINERU_WAIT_FOR_URL: "${MINERU_WAIT_FOR_URL:-}"
      MINERU_VLM_MIN_VRAM_GB: "${MINERU_VLM_MIN_VRAM_GB:-8}"
      MINERU_VLM_MIN_COMPUTE: "${MINERU_VLM_MIN_COMPUTE:-7.0}"
      MINERU_VLM_TARGET_VRAM_GB: "${MINERU_VLM_TARGET_VRAM_GB:-7}"
      MINERU_GPU_MEMORY_UTILIZATION: "${MINERU_GPU_MEMORY_UTILIZATION:-}"
      MINERU_MAX_MODEL_LEN: "${MINERU_MAX_MODEL_LEN:-8192}"
      MINERU_MAX_NUM_SEQS: "${MINERU_MAX_NUM_SEQS:-16}"
      MINERU_MAX_NUM_BATCHED_TOKENS: "${MINERU_MAX_NUM_BATCHED_TOKENS:-16384}"
      MINERU_MM_PROCESSOR_CACHE_GB: "${MINERU_MM_PROCESSOR_CACHE_GB:-1}"
      MINERU_DTYPE: "${MINERU_DTYPE:-bfloat16}"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "${MINERU_API_MAX_CONCURRENT_REQUESTS:-1}"
      MINERU_PROCESSING_WINDOW_SIZE: "${MINERU_PROCESSING_WINDOW_SIZE:-64}"
      MINERU_API_OUTPUT_ROOT: /data/output
      OMP_NUM_THREADS: "${MINERU_OMP_NUM_THREADS:-4}"
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 15s
      timeout: 8s
      retries: 20
      # The first start downloads the weights; keep the container out of the
      # "unhealthy" state while that happens.
      start_period: 900s
    networks:
      - carrel

  # ── stores ────────────────────────────────────────────────────────────────
  qdrant:
    profiles: ["standard"]
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    container_name: ${COMPOSE_PROJECT_NAME:-carrel}-qdrant
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    environment:
      TZ: "${TZ:-UTC}"
      RUN_MODE: "${QDRANT_RUN_MODE:-production}"
      QDRANT__TELEMETRY_DISABLED: "${QDRANT_TELEMETRY_DISABLED:-true}"
      # The image enables CORS and echoes any Origin back: the port only binds
      # loopback, yet a web page in a browser on this host could still read and
      # write across origins. Only backend clients use it, so it is off.
      QDRANT__SERVICE__ENABLE_CORS: "false"
    volumes:
      - "qdrant-data:/qdrant/storage:rw"
    mem_limit: "${QDRANT_MEM_LIMIT:-4g}"
    mem_reservation: "${QDRANT_MEM_RESERVATION:-1g}"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200 OK'"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - carrel

  neo4j:
    profiles: ["standard"]
    image: ${NEO4J_IMAGE:-neo4j:5.26.28-community}
    container_name: ${COMPOSE_PROJECT_NAME:-carrel}-neo4j
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-CHANGE_ME}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-1G}"
      NEO4J_dbms_usage__report_enabled: "${NEO4J_USAGE_REPORT_ENABLED:-false}"
      # A single community-edition node has no online backup, so the
      # transaction logs only serve crash recovery; the image default of
      # "2 days 2G" fills up to 2 GB after every large graph-version delete.
      NEO4J_db_tx__log_rotation_retention__policy: "1 files"
    volumes:
      - "neo4j-data:/data:rw"
      - "neo4j-logs:/logs:rw"
      - "neo4j-plugins:/plugins:rw"
      - "neo4j-import:/var/lib/neo4j/import:rw"
    mem_limit: "${NEO4J_MEM_LIMIT:-4g}"
    mem_reservation: "${NEO4J_MEM_RESERVATION:-1g}"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - carrel

  opensearch:
    profiles: ["standard"]
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.7.0}
    container_name: ${COMPOSE_PROJECT_NAME:-carrel}-opensearch
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${OPENSEARCH_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PORT:-9200}:9200"
    environment:
      # Single node, no security plugin, no performance-analyzer agent: the
      # keyword index lives on loopback and the built-in `cjk` analyzer needs
      # no extra plugin.
      discovery.type: single-node
      cluster.name: carrel
      node.name: carrel-opensearch
      network.host: 0.0.0.0
      bootstrap.memory_lock: "true"
      # Query insights are on by default and keep the text of search requests
      # in top_queries-* indices for 7 days, which deleting a knowledge base
      # does not clear; nothing here needs them.
      search.insights.top_queries.latency.enabled: "false"
      search.insights.top_queries.cpu.enabled: "false"
      search.insights.top_queries.memory.enabled: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_JAVA_HEAP:-1g} -Xmx${OPENSEARCH_JAVA_HEAP:-1g}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "opensearch-data:/usr/share/opensearch/data:rw"
    mem_limit: "${OPENSEARCH_MEM_LIMIT:-3g}"
    mem_reservation: "${OPENSEARCH_MEM_RESERVATION:-1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - carrel

networks:
  carrel:
    driver: bridge

volumes:
  qdrant-data:
  opensearch-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  neo4j-import:
